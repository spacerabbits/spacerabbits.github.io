<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
<meta charset="UTF-8">
<title data-ru="Задание 2: Эко-Саймон" data-he="משימה 2: סיימון אקולוגי">Задание 2: Эко-Саймон</title>
<style>
  body { font-family: 'Assistant', 'Rubik', Arial, sans-serif; background: #e3f2fd; color: #0d253f; margin: 0; padding: 18px; }
  .box { max-width: 620px; margin: auto; background: #fff; border-radius: 14px; padding: 20px; border: 2px solid #1565c0; text-align: center; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .timer-pill { font-weight: bold; font-size: 17px; color: #c62828; background: #ffebee; border: 1px solid #ef5350; padding: 6px 12px; border-radius: 8px; font-family: monospace; }
  
  .lang-group { display: inline-flex; gap: 6px; align-items: center; }
  .lang-btn { background: #ffffff; color: #1b5e20; border: 2px solid #2e7d32; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; }
  .lang-btn.active-lang { background: #1b5e20; color: #ffffff; border-color: #ffffff; }

  .grid { display: grid; grid-template-columns: repeat(2, 120px); gap: 14px; justify-content: center; margin: 16px auto; direction: ltr; }
  .pad { width: 120px; height: 110px; border-radius: 14px; border: none; cursor: pointer; opacity: 0.72; transition: 0.15s; font-weight: bold; color: #fff; font-size: 16px; }
  .pad.active { opacity: 1; transform: scale(1.07); box-shadow: 0 0 18px rgba(0,0,0,0.45); }
  #p0 { background: #2e7d32; }
  #p1 { background: #fbc02d; color: #222; }
  #p2 { background: #0288d1; }
  #p3 { background: #e64a19; }
  .start-btn { background: #1565c0; color: #fff; border: none; padding: 9px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; }
  .status { font-size: 17px; font-weight: bold; margin-top: 12px; min-height: 24px; }
</style>
</head>
<body>
<div class="box">
  <div class="top-bar">
    <div class="timer-pill" id="room-timer">⏱️ 07:50</div>
    <div class="lang-group">
      <button class="lang-btn lang-btn-ru active-lang" onclick="setLang('ru')">🇷🇺 Русский</button>
      <button class="lang-btn lang-btn-he" onclick="setLang('he')">🇮🇱 עברית</button>
    </div>
  </div>
  <h2 data-ru="Задание 2: Эко-Саймон" data-he="משימה 2: סיימון אקולוגי">Задание 2: Эко-Саймон</h2>
  <p data-ru="Повторите последовательность сигналов за 3 этапа, чтобы получить следующие цифры (ошибка = -20 сек.):" data-he="חזרו על רצף הנוריות ב-3 שלבים כדי לקבל את הספרות הבאות (טעות = -20 שניות):">Повторите последовательность сигналов за 3 этапа, чтобы получить следующие цифры (ошибка = -20 сек.):</p>
  <p id="stage">Этап: 0 / 3</p>
  <button class="start-btn" onclick="startStage()" data-ru="Запустить этап" data-he="הפעל שלב">Запустить этап</button>
  <div class="grid">
    <button class="pad" id="p0" onclick="hit(0)" data-ru="Ветер" data-he="רוח">Ветер</button>
    <button class="pad" id="p1" onclick="hit(1)" data-ru="Солнце" data-he="שמש">Солнце</button>
    <button class="pad" id="p2" onclick="hit(2)" data-ru="Вода" data-he="מים">Вода</button>
    <button class="pad" id="p3" onclick="hit(3)" data-ru="Накопление" data-he="אגירה">Накопление</button>
  </div>
  <div class="status" id="status"></div>
</div>
<script>

const PENALTY_SEC = 20;
const INITIAL_SEC = 7 * 60 + 50;

function getLang() {
  const saved = localStorage.getItem('codeNatureLang');
  if (saved === 'he' || saved === 'ru') return saved;
  localStorage.setItem('codeNatureLang', 'ru');
  return 'ru';
}

function setLang(lang) {
  const normalized = lang === 'he' ? 'he' : 'ru';
  localStorage.setItem('codeNatureLang', normalized);
  window.dispatchEvent(new CustomEvent('codeNatureLangChanged', { detail: normalized }));
  applyLangDOM(normalized);
}

function applyLangDOM(lang) {
  const isRu = lang === 'ru';
  document.documentElement.lang = isRu ? 'ru' : 'he';
  document.documentElement.dir = isRu ? 'ltr' : 'rtl';
  document.querySelectorAll('[data-ru]').forEach((el) => {
    const val = isRu ? el.getAttribute('data-ru') : el.getAttribute('data-he');
    if (val !== null) {
      if (el.getAttribute('data-html') === '1') {
        el.innerHTML = val;
      } else {
        el.textContent = val;
      }
    }
  });
  document.querySelectorAll('.lang-btn-ru').forEach((b) => {
    b.classList.toggle('active-lang', isRu);
  });
  document.querySelectorAll('.lang-btn-he').forEach((b) => {
    b.classList.toggle('active-lang', !isRu);
  });
}

function getRemainingSec() {
  const saved = localStorage.getItem('codeNatureTimerSec');
  if (saved === null) {
    localStorage.setItem('codeNatureTimerSec', String(INITIAL_SEC));
    return INITIAL_SEC;
  }
  const n = parseInt(saved, 10);
  return Number.isNaN(n) ? INITIAL_SEC : Math.max(0, n);
}

function setRemainingSec(sec) {
  const clamped = Math.max(0, sec);
  localStorage.setItem('codeNatureTimerSec', String(clamped));
  window.dispatchEvent(new CustomEvent('codeNatureTimerUpdated', { detail: clamped }));
  return clamped;
}

function applyWrongPenalty() {
  const cur = getRemainingSec();
  return setRemainingSec(cur - PENALTY_SEC);
}

function markRoomSolved(roomNum, payload) {
  const solved = JSON.parse(localStorage.getItem('codeNatureSolvedRooms') || '{}');
  solved[roomNum] = payload || true;
  localStorage.setItem('codeNatureSolvedRooms', JSON.stringify(solved));
  window.dispatchEvent(new CustomEvent('codeNatureProgressUpdated', { detail: solved }));
}

function getSolvedRooms() {
  return JSON.parse(localStorage.getItem('codeNatureSolvedRooms') || '{}');
}

function formatSec(sec) {
  const m = String(Math.floor(sec / 60)).padStart(2, '0');
  const s = String(sec % 60).padStart(2, '0');
  return `${m}:${s}`;
}


const seqs = [[0, 1, 2], [1, 3, 0, 2], [2, 0, 3, 1, 0]];
let st = 0, step = 0, busy = false;

function updateStageLabel() {
  const lang = getLang();
  document.getElementById('stage').textContent = lang === 'ru'
    ? `Этап: ${st} / 3`
    : `שלב: ${st} / 3`;
}

function renderSolvedState2() {
  const solved = getSolvedRooms();
  const statusEl = document.getElementById('status');
  const lang = getLang();
  if (solved[2]) {
    st = 3;
    updateStageLabel();
    statusEl.style.color = '#1b5e20';
    statusEl.textContent = lang === 'ru'
      ? `✅ Готово! Следующие цифры: ${solved[2].digits}.`
      : `✅ הושלם! הספרות הבאות: ${solved[2].digits}.`;
  }
}

function syncTimerBadge() {
  document.getElementById('room-timer').textContent = '⏱️ ' + formatSec(getRemainingSec());
}
window.addEventListener('storage', () => { syncTimerBadge(); applyLangDOM(getLang()); updateStageLabel(); renderSolvedState2(); });
window.addEventListener('codeNatureTimerUpdated', syncTimerBadge);
window.addEventListener('codeNatureProgressUpdated', renderSolvedState2);
window.addEventListener('codeNatureLangChanged', (e) => { applyLangDOM(e.detail); updateStageLabel(); renderSolvedState2(); });
setInterval(() => { syncTimerBadge(); renderSolvedState2(); }, 500);
syncTimerBadge();
applyLangDOM(getLang());
updateStageLabel();
renderSolvedState2();

function blink(i) {
  const el = document.getElementById('p' + i);
  el.classList.add('active');
  setTimeout(() => el.classList.remove('active'), 380);
}

function startStage() {
  if (busy || st >= 3) return;
  busy = true; step = 0;
  const lang = getLang();
  document.getElementById('stage').textContent = lang === 'ru'
    ? `Этап: ${st + 1} / 3`
    : `שלב: ${st + 1} / 3`;
  document.getElementById('status').textContent = lang === 'ru'
    ? 'Смотрите последовательность...'
    : 'צפו ברצף...';
  const s = seqs[st];
  s.forEach((v, idx) => {
    setTimeout(() => {
      blink(v);
      if (idx === s.length - 1) setTimeout(() => {
        busy = false;
        const l = getLang();
        document.getElementById('status').textContent = l === 'ru'
          ? 'Ваш ход! Нажимайте по порядку.'
          : 'תורכם! לחצו לפי הסדר.';
      }, 420);
    }, (idx + 1) * 600);
  });
}

function hit(i) {
  if (busy || st >= 3) return;
  blink(i);
  const s = seqs[st];
  const lang = getLang();
  if (i === s[step]) {
    step++;
    if (step === s.length) {
      st++;
      if (st === 3) {
        markRoomSolved(2, { digits: "75" });
        renderSolvedState2();
      } else {
        document.getElementById('status').style.color = '#1565c0';
        document.getElementById('status').textContent = lang === 'ru'
          ? '✔️ Этап пройден! Нажмите для продолжения.'
          : '✔️ שלב הושלם! לחצו להמשך.';
      }
    }
  } else {
    step = 0;
    applyWrongPenalty();
    syncTimerBadge();
    document.getElementById('status').style.color = '#c62828';
    document.getElementById('status').textContent = lang === 'ru'
      ? '❌ Ошибка в последовательности! Списано 20 секунд с таймера.'
      : '❌ טעות ברצף! ירדו 20 שניות מהטיימר.';
  }
}
</script>
</body>
</html>
